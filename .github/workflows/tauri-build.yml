name: Build Tauri App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            pkg-config \
            clang \
            libclang-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter zebraa-desktop exec vite build

      - name: Build Cargo workspace
        run: cargo build --workspace

      - name: Build Tauri app with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app
          tagName: v__VERSION__
          releaseName: 'Zebraa v__VERSION__'
          releaseBody: 'See assets for build downloads.'
          releaseDraft: true
          prerelease: false

      - name: Package macOS plain zip
        if: matrix.platform == 'macos-latest'
        run: ./scripts/package-mac-zip.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zebraa-bundle-${{ matrix.platform }}
          path: |
            target/release/bundle/
            crates/app/target/release/bundle/
          if-no-files-found: ignore
