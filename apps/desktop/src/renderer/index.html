<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zebraa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/index.css" />
    <script>
      (function () {
        var stored = localStorage.getItem('zebraa-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#111;color:#ff5a1f;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerHTML = '<h1>Global JS Error</h1><p>' + e.message + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre>';
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#111;color:#ff5a1f;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerHTML = '<h1>Unhandled Rejection</h1><p>' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</p><pre>' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre>';
        document.body.appendChild(errDiv);
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
